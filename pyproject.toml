[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiocop"
version = "1.1.5"
description = "Non-intrusive monitoring for Python asyncio and uvloop. Detects, pinpoints, and logs blocking IO and CPU calls that freeze your event loop."
readme = "README.md"
keywords = ["asyncio", "uvloop", "monitoring", "blocking-io", "event-loop", "debugging", "performance"]
authors = [
    {name = "Fever Labs, Inc.", email = "engineering@feverup.com"},
    {name = "Adrià Ardila", email = "adria.ardila@feverup.com"}
]
maintainers = [
    {name = "Fever Labs, Inc.", email = "engineering@feverup.com"},
    {name = "Adrià Ardila", email = "adria.ardila@feverup.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Environment :: Console",
]
license = {text = "MIT"}
dependencies = []
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "pytest-asyncio",  # async test support
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
    "uvloop; sys_platform != 'win32'",  # uvloop testing (Unix only)
]
docs = [
    "mkdocs-material",  # documentation
]

[project.urls]
bugs = "https://github.com/Feverup/aiocop/issues"
changelog = "https://github.com/Feverup/aiocop/blob/master/HISTORY.md"
homepage = "https://github.com/Feverup/aiocop"


[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = true
