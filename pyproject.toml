[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiocop"
version = "0.1.2"
description = "Non-intrusive monitoring for Python asyncio. Detects, pinpoints, and logs blocking IO and CPU calls that freeze your event loop."
readme = "README.md"
authors = [
    {name = "Fever Labs, Inc.", email = "engineering@feverup.com"},
    {name = "Adrià Ardila", email = "adria.ardila@feverup.com"}
]
maintainers = [
    {name = "Fever Labs, Inc.", email = "engineering@feverup.com"},
    {name = "Adrià Ardila", email = "adria.ardila@feverup.com"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = []
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
]

[project.urls]
bugs = "https://github.com/Feverup/aiocop/issues"
changelog = "https://github.com/Feverup/aiocop/blob/master/changelog.md"
homepage = "https://github.com/Feverup/aiocop"


[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
